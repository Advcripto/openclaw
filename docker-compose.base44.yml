services:
  openclaw:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - openclaw_node_modules:/app/node_modules
      - openclaw_state:/home/node/.openclaw
    environment:
      - HOME=/home/node
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_SKIP_CHANNELS=1
      - OPENCLAW_UI_DEV_GATEWAY_URL=http://localhost:18789
      - OPENCLAW_RUN_NODE_SKIP_DTS_BUILD=1
      - OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB=4096
      - BASE44_PREVIEW_MODE=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command:
      - sh
      - -ec
      - |
        corepack enable
        corepack prepare pnpm@12.7.0 --activate
        pnpm install --frozen-lockfile
        pnpm build
        node dist/index.js gateway --bind loopback --port 18789 &
        cd ui && exec node ../scripts/run-node-package-bin.mts vite --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    restart: on-failure

volumes:
  openclaw_node_modules:
  openclaw_state:
